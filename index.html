<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        /* Основные стили страницы */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fdfae1; /* Светлый фон */
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
            text-align: center;
        }

        /* Контейнер для видео */
        .video-wrapper {
            width: 100%;
            max-width: 350px; 
            height: auto;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* Чтобы видео накладывались друг на друга при смене */
        }

        /* Стиль для самих видеоплееров */
        video {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: block;
        }

        /* Класс для скрытия элементов */
        .hidden {
            display: none !important;
        }

        /* Заголовок */
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Блок с кнопками */
        .buttons-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Общий стиль кнопок */
        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
            font-weight: bold;
        }

        /* Кнопка YES */
        #yesBtn {
            background-color: #4CAF50; /* Зеленый */
            color: white;
            transition: all 0.3s ease; 
        }

        /* Кнопка NO */
        #noBtn {
            background-color: #ef4444; /* Красный */
            color: white;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="minionVideo" 
               src="AFA22B17-F295-4D4E-BD63-9F202D863C55.mp4" 
               autoplay muted playsinline preload="auto">
        </video>
        
        <video id="fireworksVideo" 
               src="BE4F6EAA-3CAB-4964-BE61-670BAF6C0F39.mov" 
               class="hidden" 
               playsinline preload="auto">
        </video>
    </div>

    <h1 id="mainText">Will you be my valentine?</h1>

    <div class="buttons-container" id="btnGroup">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const minionVideo = document.getElementById('minionVideo');
        const fireworksVideo = document.getElementById('fireworksVideo');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainText = document.getElementById('mainText');
        const btnGroup = document.getElementById('btnGroup');

        let clickCount = 0;
        let currentYesFontSize = 18;
        let currentYesPadding = 12; 

        const noTexts = [
            "Are you sure? 🥺",
            "Really sure?? 😢",
            "Think again! 💔",
            "Last chance! 😭",
            "Don't do this... 🙏",
            "You're breaking my heart! 😿",
            "PLEASE! 🧸"
        ];

        // Функция перезапуска миньона
        function restartMinion() {
            minionVideo.currentTime = 0;
            minionVideo.play();
        }

        // --- ЛОГИКА NO ---
        noBtn.addEventListener('click', function() {
            restartMinion(); // Перезапуск видео

            // Меняем текст кнопки NO
            if (clickCount < noTexts.length) {
                noBtn.innerText = noTexts[clickCount];
            }

            // Увеличиваем кнопку YES
            clickCount++;
            currentYesFontSize += 15;
            currentYesPadding += 10;
            
            yesBtn.style.fontSize = `${currentYesFontSize}px`;
            yesBtn.style.padding = `${currentYesPadding}px ${currentYesPadding * 2}px`;
        });

        // --- ЛОГИКА YES ---
        yesBtn.addEventListener('click', function() {
            // Прячем миньона и кнопки
            minionVideo.classList.add('hidden');
            minionVideo.pause(); // Останавливаем миньона, чтобы не грузил фон
            
            btnGroup.classList.add('hidden');

            // Меняем текст
            mainText.innerText = "YAYYY!!! ❤️";

            // Показываем и запускаем салют
            fireworksVideo.classList.remove('hidden');
            fireworksVideo.currentTime = 0;
            fireworksVideo.muted = false; // Включаем звук (если есть)
            fireworksVideo.play();
        });
    </script>
</body>
</html>
