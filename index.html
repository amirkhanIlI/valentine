<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding-top: 50px; 
            background-color: #fdfae1;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
            text-align: center;
        }

        .video-wrapper {
            width: 80%; 
            max-width: 280px; 
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background-color: #000;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #333;
            margin: 10px 0 20px 0;
            font-size: 20px;
            padding: 0 10px;
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap; 
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
            z-index: 10; 
        }

        #noBtn {
            background-color: #ef4444;
            color: white;
            position: relative; 
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="minionVideo" 
               src="AFA22B17-F295-4D4E-BD63-9F202D863C55.mov" 
               autoplay muted playsinline preload="auto">
        </video>
        
        <video id="fireworksVideo" 
               src="BE4F6EAA-3CAB-4964-BE61-670BAF6C0F39.mov" 
               class="hidden" 
               playsinline preload="auto">
        </video>
    </div>

    <h1 id="mainText">Will you be my valentine?</h1>

    <div class="buttons-container" id="btnGroup">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const minionVideo = document.getElementById('minionVideo');
        const fireworksVideo = document.getElementById('fireworksVideo');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainText = document.getElementById('mainText');
        const btnGroup = document.getElementById('btnGroup');

        let clickCount = 0;
        let currentYesFontSize = 16;
        let currentYesPadding = 10; 
        let noOffset = 0;

        const noTexts = [
            "Are you sure? 🥺", "Really sure?? 😢", "Think again! 💔", 
            "Last chance! 😭", "Don't do this... 🙏", "PLEASE! 🧸"
        ];

        function checkAndRestartMinion() {
            if (minionVideo.ended) {
                minionVideo.currentTime = 0;
                minionVideo.play();
            }
        }

        noBtn.addEventListener('click', function() {
            checkAndRestartMinion();

            if (clickCount < noTexts.length) {
                noBtn.innerText = noTexts[clickCount];
            }

            clickCount++;
            
            currentYesFontSize += 12;
            currentYesPadding += 8;
            yesBtn.style.fontSize = `${currentYesFontSize}px`;
            yesBtn.style.padding = `${currentYesPadding}px ${currentYesPadding * 1.5}px`;

            noOffset += 50; 
            noBtn.style.transform = `translateX(${noOffset}px)`;
        });

        yesBtn.addEventListener('click', function() {
            minionVideo.classList.add('hidden');
            minionVideo.pause();
            
            btnGroup.classList.add('hidden');
            mainText.innerText = "YAYYY!!! ❤️";

            fireworksVideo.classList.remove('hidden');
            fireworksVideo.play();
        });
    </script>
</body>
</html>
