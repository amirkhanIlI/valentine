<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 5vh;
            background-color: #fdfae1;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .video-wrapper {
            width: 70%;
            max-width: 250px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        video {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 30px;
        }

        .buttons-container {
            position: relative;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        #yesBtn {
            background-color: #4CAF50;
            color: white;
            z-index: 100;
        }

        #noBtn {
            background-color: #ef4444;
            color: white;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <video id="minionVideo" 
               src="AFA22B17-F295-4D4E-BD63-9F202D863C55.mov" 
               autoplay muted playsinline preload="auto">
        </video>
        
        <video id="fireworksVideo" 
               src="https://BE4F6EAA-3CAB-4964-BE61-670BAF6C0F39.mov" 
               class="hidden" 
               playsinline preload="auto" muted>
        </video>
    </div>

    <h1 id="mainText">Will you be my valentine?</h1>

    <div class="buttons-container" id="btnGroup">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const minionVideo = document.getElementById('minionVideo');
        const fireworksVideo = document.getElementById('fireworksVideo');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainText = document.getElementById('mainText');
        const btnGroup = document.getElementById('btnGroup');

        let clickCount = 0;
        let currentYesFontSize = 18;
        let currentYesPadding = 12;
        let noShift = 0;

        const noTexts = [
            "Are you sure? 🥺", "Really sure?? 😢", "Think again! 💔", 
            "Last chance! 😭", "Don't do this... 🙏", "PLEASE! 🧸"
        ];

        // Логика кнопки No
        noBtn.addEventListener('click', function() {
            // Видео миньона перезапускается только если досмотрено до конца
            if (minionVideo.ended) {
                minionVideo.currentTime = 0;
                minionVideo.play();
            }

            if (clickCount < noTexts.length) {
                noBtn.innerText = noTexts[clickCount];
            }

            clickCount++;
            
            // Увеличиваем Yes
            currentYesFontSize += 15;
            currentYesPadding += 10;
            yesBtn.style.fontSize = currentYesFontSize + 'px';
            yesBtn.style.padding = currentYesPadding + 'px ' + (currentYesPadding * 2) + 'px';

            // Улетаем вправо
            noShift += 100;
            noBtn.style.transform = `translateX(${noShift}px)`;
            
            // Если совсем далеко ушла — скрываем, чтобы не мешала
            if (noShift > 400) {
                noBtn.style.opacity = '0';
            }
        });

        // Логика кнопки Yes
        yesBtn.addEventListener('click', function() {
            // Мгновенная рокировка
            minionVideo.classList.add('hidden');
            minionVideo.pause();
            
            btnGroup.classList.add('hidden');
            mainText.innerText = "YAYYY!!! ❤️";

            fireworksVideo.classList.remove('hidden');
            fireworksVideo.play(); // Просто запуск
        });
    </script>
</body>
</html>
